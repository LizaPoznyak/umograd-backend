name: umograd

services:
  db:
    image: mysql:8.1.0
    restart: on-failure
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d

  redis:
    image: redis:8.6.3
    restart: on-failure
    ports:
      - "6379:6379"